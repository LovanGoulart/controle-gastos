{% extends "base.html" %}

{% block title %}Login - Controle de Gastos{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <i data-lucide="wallet" style="color: white; width: 32px; height: 32px;"></i>
                </div>
                <h1>Controle de Gastos</h1>
                <p>Gerencie suas financas de forma inteligente</p>
            </div>
            <form class="auth-form" method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <div class="search-box">
                        <i data-lucide="mail" style="width: 18px; height: 18px;"></i>
                        <input type="email" name="email" class="form-input" placeholder="seu@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <div class="search-box">
                        <i data-lucide="lock" style="width: 18px; height: 18px;"></i>
                        <input type="password" name="password" class="form-input" placeholder="Sua senha" required>
                    </div>
                </div>
                <div class="remember-forgot">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" name="remember" value="1">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="{{ url_for('forgot_password') }}" class="forgot-link">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
                    Entrar
                </button>
            </form>
            <div class="auth-footer">
                Ainda nao tem conta? <a href="{{ url_for('register') }}">Cadastre-se</a>
            </div>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
{% endblock %}
