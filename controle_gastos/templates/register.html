{% extends "base.html" %}

{% block title %}Cadastro - Controle de Gastos{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <i data-lucide="wallet" style="color: white; width: 32px; height: 32px;"></i>
                </div>
                <h1>Criar Conta</h1>
                <p>Comece a controlar suas financas hoje</p>
            </div>
            <form class="auth-form" method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label class="form-label">Nome Completo</label>
                    <div class="search-box">
                        <i data-lucide="user" style="width: 18px; height: 18px;"></i>
                        <input type="text" name="name" class="form-input" placeholder="Seu nome" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <div class="search-box">
                        <i data-lucide="mail" style="width: 18px; height: 18px;"></i>
                        <input type="email" name="email" class="form-input" placeholder="seu@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <div class="search-box">
                        <i data-lucide="lock" style="width: 18px; height: 18px;"></i>
                        <input type="password" name="password" class="form-input" placeholder="Minimo 6 caracteres" required minlength="6">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar Senha</label>
                    <div class="search-box">
                        <i data-lucide="lock" style="width: 18px; height: 18px;"></i>
                        <input type="password" name="confirm_password" class="form-input" placeholder="Repita a senha" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
                    Criar Conta
                </button>
            </form>
            <div class="auth-footer">
                Ja tem conta? <a href="{{ url_for('login') }}">Fazer login</a>
            </div>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
{% endblock %}
