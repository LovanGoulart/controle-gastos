{% extends "base.html" %}

{% block title %}Recuperar Senha - Controle de Gastos{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <i data-lucide="wallet" style="color: white; width: 32px; height: 32px;"></i>
                </div>
                <h1>Recuperar Senha</h1>
                <p>Enviaremos instrucoes para seu e-mail</p>
            </div>
            <form class="auth-form" method="POST" action="{{ url_for('forgot_password') }}">
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <div class="search-box">
                        <i data-lucide="mail" style="width: 18px; height: 18px;"></i>
                        <input type="email" name="email" class="form-input" placeholder="seu@email.com" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    <i data-lucide="send" style="width: 18px; height: 18px;"></i>
                    Enviar Instrucoes
                </button>
            </form>
            <div class="auth-footer">
                <a href="{{ url_for('login') }}">Voltar para o login</a>
            </div>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
{% endblock %}
